*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--fond);color:var(--encre);font-family:var(--police-texte);font-weight:var(--poids-texte);font-size:var(--taille-texte);line-height:1.55;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
.caps{font-family:var(--police-titre);text-transform:uppercase;letter-spacing:var(--espacement-titre);font-weight:var(--poids-titre)}
.compo{display:flex;gap:12px;align-items:baseline;margin:0;font-size:var(--taille-petit);color:var(--doux)}
.compo .caps{font-size:.72rem;color:var(--encre)}
#finition-note{margin:0;color:var(--doux);font-size:var(--taille-petit)}
#finition-note:empty,#format-detail:empty{display:none}
.brouillon{font-family:var(--police-texte);font-style:italic;text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--doux);border:1px dashed var(--doux);padding:1px 8px;border-radius:999px;vertical-align:middle}
.coll-texte p.intro + p.intro{margin-top:-4px}
/* Logo (image en masque : prend la couleur du texte) */
.logo{display:block;flex:none;aspect-ratio:636/615;background-color:currentColor;-webkit-mask:var(--logo-img) center/contain no-repeat;mask:var(--logo-img) center/contain no-repeat}
.ph-photo{background:var(--tuile-1)}
.ph-vide{background:#D9D6D1}
.ph-vide span{font-family:var(--police-texte);font-style:italic;font-weight:300;font-size:.9rem;color:#8A8680}
.ph-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
/* Prix */
.apd{font-family:var(--police-prix);font-style:italic;font-weight:300;font-size:1em;letter-spacing:.02em;color:var(--doux)}
.carte-prix b,.prix-tete b,.opt b{font-family:var(--police-prix);font-weight:var(--poids-prix);font-style:var(--style-prix);font-variant-numeric:tabular-nums;letter-spacing:.02em}
em,.detail{font-style:italic;font-weight:300}
strong,b{font-weight:var(--poids-fort)}
:focus-visible{outline:1.5px solid var(--encre);outline-offset:3px}

/* En-tête */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fond);color:var(--encre);border-bottom:1px solid var(--ligne);transition:background .3s,color .3s,border-color .3s}
/* Favoris */
.droite{display:flex;align-items:center;gap:22px;min-width:0}
.fav-lien{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;flex:none;font-size:.82rem;padding-block:4px;border-bottom:1px solid transparent}
.fav-lien:hover,.fav-lien[aria-current="page"]{border-bottom-color:currentColor}
.fav-ico{position:relative;display:grid;place-items:center}
.fav-lien svg{width:1.12em;height:1.12em;fill:none;stroke-width:1.4;margin-top:-.08em}  /* cœur à la hauteur des capitales, trait ≈ Jost light */
.fav-n{position:absolute;top:-4px;right:-8px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--rose);color:var(--encre);font-family:var(--police-titre);font-size:.62rem;line-height:16px;text-align:center}
.carte-box{position:relative;min-width:0}
.fav{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;color:var(--encre)}
.fav svg{width:18px;height:18px;fill:none;stroke-width:1.3;transition:fill .15s}
.fav.on svg{fill:var(--rose)}
.fav:focus-visible{outline:1.5px solid var(--encre);outline-offset:2px}
.fav-coin{position:absolute;top:4px;right:4px;width:34px;height:34px;justify-content:center;color:#fff}
.fav-coin svg{width:22px;height:22px;filter:drop-shadow(0 0 2px rgba(0,0,0,.3))}
.fav-large{justify-content:center;border:var(--filet);padding:14px 20px;font-size:.85rem}
.fav-large .caps{font-size:.8rem}
.fav-cta{display:inline-flex;margin-top:18px}
.fav-intro:has(.lien-jost){display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap}.fav-intro p{margin:0}
header .bar{position:relative}
@media (max-width:1180px) and (min-width:761px){header nav ul{flex-wrap:nowrap;white-space:nowrap;gap:6px 14px;font-size:clamp(.66rem,1.05vw,.82rem)}header .fav-lien{font-size:clamp(.66rem,1.05vw,.82rem)}header .droite{gap:14px}header .marque{gap:12px}header .marque span{font-size:clamp(.7rem,1.2vw,.95rem)}header .marque .logo{width:30px}}
@media (max-width:880px) and (min-width:761px){header nav ul{gap:6px 10px;font-size:.62rem}header .fav-lien{font-size:.62rem}header .marque span{font-size:.66rem}header .bar{gap:12px}header .droite{gap:10px}header .marque{gap:8px}}
@media (max-width:760px){.fav-lien{position:absolute;top:14px;right:clamp(16px,3vw,40px)}}
@media (max-width:560px){.fav-txt{display:none}}
@media (max-width:760px){.droite{width:100%}.droite nav{flex:1}}
/* Accueil : menu transparent posé sur la photo, redevient opaque au défilement */
body.accueil main{margin-top:calc(-1 * var(--h-header,64px))}
body.accueil header{background:transparent;color:var(--menu-photo);border-bottom-color:transparent}
body.accueil.defile header{background:var(--fond);color:var(--encre);border-bottom-color:var(--ligne)}
body.accueil.menu-blanc .bandeau-photo::before{content:"";position:absolute;inset:0 0 auto 0;height:35%;background:linear-gradient(rgba(30,30,30,.28),transparent);z-index:1}
header .bar{max-width:none;padding-inline:clamp(16px,3vw,40px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.marque{display:flex;align-items:center;gap:20px;text-decoration:none;min-width:0}
.marque .logo{width:36px}
.marque span{font-size:.95rem;line-height:1.2;white-space:nowrap}
@media (max-width:420px){.marque{gap:14px}.marque span{font-size:.8rem}}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.82rem}
nav a{text-decoration:none;padding-block:4px;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current="page"]{border-bottom-color:currentColor}
@media (max-width:760px){
  .bar{flex-direction:column;align-items:flex-start;gap:10px;padding-block:12px}
  nav{width:100%;overflow-x:auto}
  nav ul{flex-wrap:nowrap;white-space:nowrap}
}

/* Accueil : bandeau photo pleine largeur, logo blanc centré */
.bandeau{position:relative;height:clamp(280px,52vw,640px);overflow:hidden;display:grid;place-items:center}
.bandeau-photo{position:absolute;inset:0;background:linear-gradient(160deg,#a9a273 0%,var(--olive) 45%,#7d7731 100%)}
.bandeau-photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transform:scale(1.2);transform-origin:center} /* zoom 20 % centré */
.bandeau-photo::after{content:"";position:absolute;inset:0;background:rgba(30,30,30,.12)}
.bandeau-photo i{position:absolute;left:clamp(16px,4vw,48px);bottom:14px;font-size:.75rem;color:rgba(255,255,255,.75);z-index:1}
.bandeau-logo{position:relative;z-index:1;width:clamp(110px,16vw,200px);color:var(--logo-photo);transition:color .3s}
body:not(.logo-blanc) .bandeau-photo::after{background:rgba(236,233,228,.12)}
/* Accueil */
/* Intro d'accueil : accroche en tête, puis texte éditorial (gauche) et infos pratiques (droite) */
/* Intro d'accueil : bandeau centré, titre 1/3 et texte 2/3 de même hauteur, centrés verticalement */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(20px,3vw,32px) clamp(28px,5vw,64px);align-items:center;padding-block:clamp(40px,7vw,88px) clamp(28px,5vw,56px)}
/* décalage d'environ 1 cm par rapport au séparateur des sections */
.intro > *{margin-inline:0}
.intro h1{padding-left:1cm}
.intro-texte{margin-right:1cm}
.intro h1{font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.2;margin:0;text-wrap:balance}
.intro-texte{display:flex;flex-direction:column;gap:10px;min-width:0;padding-left:clamp(20px,3vw,40px);border-left:1px solid var(--ligne)}
.intro .chapeau{margin:0;font-size:clamp(1.05rem,1.45vw,1.2rem);line-height:1.5;color:var(--encre);text-wrap:pretty}
.intro .pratique{margin:0;font-style:italic;font-weight:300;font-size:.95rem;color:var(--doux)}
.intro .logo-xl{width:clamp(90px,14vw,150px);height:auto;margin-bottom:28px;display:block}
@media (max-width:760px){.intro{grid-template-columns:1fr;align-items:start}.intro-texte{padding-left:0;border-left:0;margin-right:0}.intro h1{padding-left:0}}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:clamp(40px,7vw,80px)}
.cat{display:flex;flex-direction:column;gap:10px;text-decoration:none}
.cat .ph{aspect-ratio:3/4}
.cat-nom{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.cat-nom .n{font-family:var(--police-prix);font-style:italic;font-weight:300;letter-spacing:.02em;text-transform:none;color:var(--doux);font-size:.8rem}
@media (max-width:600px){.cats{gap:8px}.cat-nom{flex-direction:column;gap:2px;font-size:.75rem}}

/* Collections : une seule ligne qui défile vers la droite */
.colls{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 2 * 18px) / 2.6);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:clamp(40px,7vw,80px)}
.colls::-webkit-scrollbar{display:none}
.colls > .coll{scroll-snap-align:start}
@media (max-width:860px){.colls{grid-auto-columns:78%}}
.defil{display:flex;gap:6px}
.defil button{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border:0.5px solid var(--encre);border-radius:999px;font-family:var(--police-titre);font-size:.9rem;line-height:1}
.defil button:hover{background:var(--encre);color:var(--fond)}
.defil button:focus-visible{outline:1.5px solid var(--encre);outline-offset:2px}
.defil button[disabled]{opacity:.25;pointer-events:none}

/* ——— Lecture des formats Notion ———
   « Nom | détail | prix » ou « Nom | prix », une ligne par format.
   « [Finition] note » ouvre un groupe. Si la première colonne se répète
   (ex. « Blanc à pois | Ø12 cm | 14 »), elle devient un choix de finition. */
function lireFormats(txt){
  const lignes = [];
  let groupe = null, note = "";
  String(txt || "").split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {
    const g = l.match(/^\[(.+?)\]\s*(.*)$/);
    if (g) { groupe = g[1].trim(); note = g[2].trim(); return; }
    const parts = l.split("|").map(s => s.trim());
    if (parts.length < 2 && !/^\d+([.,]\d+)?\s*€?$/.test(l)) return;
    const prix = parseFloat((parts.pop() || "").replace(",", "."));
    if (isNaN(prix)) return;
    const [a = "", ...reste] = parts; const b = reste.filter(Boolean).join(" · ");
    lignes.push({a, b, prix, groupe, note});
  });
  /* Deux niveaux ? (groupes entre crochets, ou première colonne répétée) */
  if (lignes.some(l => l.groupe)) {
    return {niveaux:2, lignes:lignes.map(l => ({fin:l.groupe || "", note:l.note, nom:l.a, detail:l.b, prix:l.prix}))};
  }
  const distinctA = new Set(lignes.map(l => l.a));
  if (lignes.length > 2 && lignes.every(l => l.b) && distinctA.size > 1 && distinctA.size < lignes.length) {
    return {niveaux:2, lignes:lignes.map(l => ({fin:l.a, note:"", nom:l.b, detail:"", prix:l.prix}))};
  }
  if (!lignes.length && String(txt || "").trim()) {
    /* aucun prix indiqué : on garde le texte comme dimensions, prix sur demande */
    return {niveaux:1, lignes:[{fin:"", note:"", nom:"", detail:String(txt).replace(/\|/g, " ").replace(/\s+/g, " ").trim(), prix:null}]};
  }
  return {niveaux:1, lignes:lignes.map(l => ({fin:"", note:"", nom:l.a, detail:l.b, prix:l.prix}))};
}

/* Sélection de l'accueil : 2 lignes de 4. Plus tard, les pièces les plus consultées (liste SITE.populaires) ;
   en attendant, les premières pièces de chaque catégorie, en privilégiant celles qui ont une photo. */
function selectionAccueil(){
  const max = 8, choix = [];
  (SITE.populaires || []).forEach(id => { const p = PIECES.find(x => x.id === id); if (p && !choix.includes(p)) choix.push(p); });
  /* Catégories en alternance (table, vases, objets, table…) pour ne jamais avoir deux voisins de la même catégorie */
  const files = ["table", "vases", "objets"].map(cat => PIECES.filter(p => p.cats.includes(cat) && !choix.includes(p))
    .sort((x, y) => (y.photos.length > 0) - (x.photos.length > 0)));
  for (let tour = 0; choix.length < max && files.some(f => f.length); tour++) {
    const f = files[tour % files.length];
    while (f.length && choix.includes(f[0])) f.shift();
    if (f.length) choix.push(f.shift());
  }
  return choix.slice(0, max);
}

/* Réordonne une liste pour éviter deux voisins de même clé ; les pièces sans photo restent en fin de liste */
function melanger(liste, cle, cleSans = cle){
  const passe = (groupe, cle) => {
    const reste = groupe.slice(), out = [];
    while (reste.length) {
      const prec = out.length ? cle(out[out.length - 1]) : null;
      /* on prend en priorité la clé la plus représentée parmi celles différentes du voisin */
      const cand = reste.filter(p => cle(p) !== prec);
      const pool = cand.length ? cand : reste;
      const compte = k => reste.filter(p => cle(p) === k).length;
      const choix = pool.reduce((m, p) => compte(cle(p)) > compte(cle(m)) ? p : m, pool[0]);
      out.push(choix); reste.splice(reste.indexOf(choix), 1);
    }
    return out;
  };
  const avec = passe(liste.filter(p => p.photos.length), cle), sans = liste.filter(p => !p.photos.length);
  /* le premier « sans photo » ne doit pas répéter la catégorie du dernier « avec photo » */
  const suite = passe(sans, cleSans);
  if (avec.length && suite.length > 1 && cle(suite[0]) === cle(avec[avec.length - 1])) {
    const j = suite.findIndex(p => cle(p) !== cle(avec[avec.length - 1]));
    if (j > 0) suite.unshift(suite.splice(j, 1)[0]);
  }
  return avec.concat(suite);
}

function categorie(id, sousId){
  const c = CATEGORIES.find(x => x.id === id);
  let liste = id === "tout" ? PIECES : PIECES.filter(p => p.cats.includes(id));
  const s = c && c.sous && sousId ? c.sous.find(x => x.id === sousId) : null;
  if (s) liste = liste.filter(p => p.sous === s.id);
  /* Mélange : jamais deux pièces de la même catégorie (ou sous-catégorie) côte à côte */
  if (id === "tout") liste = melanger(liste, p => p.cats[0], p => p.sous || p.cats[0]);
  else if (!s && c && c.sous) liste = melanger(liste, p => p.sous || "autre");
  menu(id);
  const nomCat = c ? c.nom : "Toutes les pièces";
  const fil = s
    ? `<a href="#accueil">Accueil</a> / <a href="#${c.id}">${esc(c.nom)}</a> / ${esc(s.nom)}`
    : `<a href="#accueil">Accueil</a> / ${esc(nomCat)}`;
  const sousNav = c && c.sous
    ? `<nav class="wrap sous" aria-label="Sous-catégories">${c.sous.map(x =>
        `<a class="caps" href="#${c.id}-${x.id}" ${s && s.id === x.id ? 'aria-current="page"' : ""}>${esc(x.nom)}</a>`).join("")}
        <a class="caps" href="#${c.id}" ${!s ? 'aria-current="page"' : ""}>Tout voir</a></nav>`
    : "";
  const vide = '<p class="vide detail">Aucune pièce pour le moment.</p>';
  const contenu = c && c.affichage === "lignes"
    ? `<section class="wrap lignes">${liste.map(ligne).join("") || vide}</section>`
    : `<section class="wrap"><div class="grille">${liste.map(carte).join("")}</div>${liste.length ? "" : vide}</section>`;
  $("#page").innerHTML = `
  <section class="wrap page-tete">
    <div class="fil">${fil}</div>
    <h1 class="caps">${esc(s ? s.nom : nomCat)}</h1>
    ${c ? (c.texte ? `<p>${esc(c.texte)}</p>` : "") : `<p class="detail">${liste.length} modèles, tous réalisés sur demande.</p>`}
  </section>
  ${sousNav}
  ${contenu}`;
}

}

function fiche(id){

  const L = p.f.lignes;
  /* Libellé d'une option : nom · taille · prix (le détail va dans le menu) */
  const etiquette = (l, i) => [l.nom || (l.detail ? "" : "Format " + (i + 1)), l.detail, euros(l.prix)]
    .map(x => String(x || "").replace(/\*/g, "").trim()).filter(Boolean).join(" · ");
  const finitions = [...new Set(L.map(l => l.fin))];
  const deuxNiveaux = p.f.niveaux === 2 && finitions.length > 1;
  const detailUnique = L.length === 1 ? (L[0].detail || (L[0].nom && !/^pièce unique$/i.test(L[0].nom) && L[0].nom !== p.nom ? L[0].nom : "")) : "";
  const optionsHtml = L.length === 1
    ? (detailUnique ? `<p class="detail" style="margin:-8px 0 0;color:var(--doux);font-size:var(--taille-petit)">${md(detailUnique)}</p>` : "")
    : deuxNiveaux
      ? `<div class="choix">
          <label class="caps" for="finition">Finition</label>
          <div class="select"><select id="finition">${finitions.map((f, i) => `<option value="${i}">${esc(f)}</option>`).join("")}</select></div>
          <p class="detail" id="finition-note"></p>
        </div>
        <div class="choix">
          <label class="caps" for="format">Taille</label>
          <div class="select"><select id="format"></select></div>
          <p class="detail" id="format-detail"></p>
        </div>`
      : `<div class="choix">
          <label class="caps" for="format">Format</label>
          <div class="select"><select id="format">${L.map((l, i) => `<option value="${i}">${esc(etiquette(l, i))}</option>`).join("")}</select></div>
          <p class="detail" id="format-detail"></p>
        </div>`;
  const prixTete = L.length > 1
    ? `<span class="apd">dès</span> <b>${euros(prixMin(p))}</b>`
    : `<b>${euros(L[0].prix)}</b>`;
  const delai = p.delai ? `Comptez ${p.delai} de fabrication une fois votre commande validée.` : SITE.delais;
  const voisins = PIECES.filter(x => x.id !== p.id && x.cats.some(c => p.cats.includes(c))).slice(0, 4);

  $("#page").innerHTML = `
  <div class="wrap" style="padding-top:22px"><div class="fil"><a href="#accueil">Accueil</a> / <a href="#${p.cats[0]}">${esc(catNom(p.cats[0]))}</a> / ${esc(p.nom)}</div></div>
  <article class="wrap fiche">
    <div class="galerie${n < 2 ? " seule" : ""}">
      <div class="vignettes" role="tablist" aria-label="Photos">${photos.map(i =>
        `<button type="button" role="tab" aria-label="Photo ${i + 1}" aria-current="${i === 0}" data-i="${i}">${visuel(p.photos[i], hash(p) + i, "")}</button>`).join("")}</div>
      <div class="principale" id="principale">${visuel(p.photos[0], hash(p), `photo 1 / ${n}`)}</div>
    </div>
    <div class="infos">
      <div class="fiche-tete">
        <h1 class="caps">${esc(p.nom)}</h1>
        <p class="prix-tete">${prixTete}</p>
      </div>
      <p class="desc">${md(p.desc).replace(/\n/g, "<br>")}</p>
      ${optionsHtml}
      ${p.compo ? `<p class="compo"><span class="caps">Matière</span><span>${esc(p.compo.replace(" - ", " · "))}</span></p>` : ""}
      <a class="cta caps" href="${igUrl}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#ig"/></svg>Commander sur Instagram</a>
      <p class="cta-note detail">Ouvre une conversation avec <span style="user-select:all">@${esc(SITE.instagram)}</span>. Précisez le modèle et le format.</p>
      ${boutonFav(p, "large")}
      <div>
        <details><summary class="caps">Délais et livraison</summary><p>${esc(delai)}</p><p>${esc(SITE.livraison)}</p></details>
        <details><summary class="caps">Personnalisation</summary><p>${esc(SITE.personnalisation)}</p></details>
      </div>
      <div class="aussi"><span class="detail">Dans :</span>${p.cats.map(c => `<a href="#${c}">${esc(catNom(c))}</a>`).join("")}${p.sous ? (() => { for (const c of CATEGORIES.filter(c => p.cats.includes(c.id) && c.sous)) { const s = c.sous.find(x => x.id === p.sous); if (s) return `<a href="#${c.id}-${s.id}">${esc(s.nom)}</a>`; } return ""; })() : ""}${COLLECTIONS.filter(c => c.pieces.includes(p.id)).map(c => `<a href="#c-${c.id}">${esc(c.nom.replace(/^Collection\s*/i, ""))}</a>`).join("")}</div>
    </div>
  </article>
  ${voisins.length ? `<section class="wrap"><div class="section-tete"><h2 class="caps">Dans la même catégorie</h2></div><div class="grille">${voisins.map(carte).join("")}</div></section>` : ""}`;

  const sel = $("#format"), selFin = $("#finition");
  if (sel) {
    const visibles = () => deuxNiveaux ? L.map((l, i) => i).filter(i => L[i].fin === finitions[+selFin.value]) : L.map((l, i) => i);
    const majDetail = () => {};
    const majFin = () => {
      const ids = visibles();
      sel.innerHTML = ids.map(i => `<option value="${i}">${esc(etiquette(L[i], i))}</option>`).join("");
      const note = L[ids[0]] && L[ids[0]].note;
      $("#finition-note").textContent = note || "";
      majDetail();
    };
    sel.addEventListener("change", majDetail);
    if (selFin) { selFin.addEventListener("change", majFin); majFin(); } else majDetail();
  }

  document.querySelectorAll(".vignettes button").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i;
    document.querySelectorAll(".vignettes button").forEach(x => x.setAttribute("aria-current", x === b));
    $("#principale").innerHTML = visuel(p.photos[i], hash(p) + i, `photo ${i + 1} / ${n}`);
  }));
}

/* ---------- Favoris : gardés dans le navigateur du visiteur (rien n'est envoyé) ---------- */
const CLE_FAV = "vtc-favoris";
let FAVORIS = (() => { try { return JSON.parse(localStorage.getItem(CLE_FAV) || "[]").filter(id => PIECES.some(p => p.id === id)); } catch (e) { return []; } })();
const estFav = id => FAVORIS.includes(id);
function sauverFav(){ try { localStorage.setItem(CLE_FAV, JSON.stringify(FAVORIS)); } catch (e) {} majCompteurFav(); }
function majCompteurFav(){ const n = $("#fav-n"); if (n) { n.textContent = FAVORIS.length || ""; n.hidden = !FAVORIS.length; } }
function boutonFav(p, style){
  const on = estFav(p.id);
  const label = style === "large" ? `<span class="caps">${on ? "Dans mes favoris" : "Ajouter aux favoris"}</span>` : "";
  return `<button type="button" class="fav fav-${style}${on ? " on" : ""}" data-fav="${p.id}" aria-pressed="${on}" aria-label="${on ? "Retirer des favoris" : "Ajouter aux favoris"} : ${esc(p.nom)}"><svg aria-hidden="true"><use href="#coeur"/></svg>${label}</button>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-fav]"); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const id = b.dataset.fav;
  FAVORIS = estFav(id) ? FAVORIS.filter(x => x !== id) : [...FAVORIS, id];
  sauverFav();
  if (location.hash === "#favoris") return favorisPage();
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(x => { const p = PIECES.find(q => q.id === id); x.outerHTML = boutonFav(p, x.classList.contains("fav-large") ? "large" : "coin"); });
});
function favorisPage(){
  menu("favoris");
  const liste = FAVORIS.map(id => PIECES.find(p => p.id === id)).filter(Boolean);
  $("#page").innerHTML = `
  <section class="wrap page-tete">
    <div class="fil"><a href="#accueil">Accueil</a> / Favoris</div>
    <h1 class="caps">Favoris</h1>
    <div class="fav-intro"><p>${liste.length ? `${liste.length} pièce${liste.length > 1 ? "s" : ""} dans votre sélection. Pour commander, envoyez votre sélection sur Instagram en précisant le modèle, la taille et la couleur.` : "Aucune pièce dans vos favoris pour le moment. Touchez le cœur d'une pièce pour la retrouver ici."}</p>
    ${liste.length ? `<a class="cta caps fav-cta" href="${igUrl}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#ig"/></svg>Envoyer ma sélection sur Instagram</a>` : `<a class="lien-jost" href="#tout">Voir tous les produits</a>`}</div>
  </section>
  ${liste.length ? `<section class="wrap"><div class="grille">${liste.map(carte).join("")}</div></section>` : ""}`;
}


function route(){
  const h = location.hash.slice(1);
  document.body.classList.remove("accueil", "defile");
  if (h.startsWith("p-")) fiche(h.slice(2));
  else if (h.startsWith("c-")) collection(h.slice(2));
  else if (h === "collections") collectionsPage();
  else if (h === "favoris") favorisPage();
  else if (CATEGORIES.some(c => c.sous && h.startsWith(c.id + "-"))) { const c = CATEGORIES.find(c => c.sous && h.startsWith(c.id + "-")); categorie(c.id, h.slice(c.id.length + 1)); }
  else if (h === "tout" || CATEGORIES.some(c => c.id === h)) categorie(h);
  else accueil();
  window.scrollTo(0, 0);
}

const lienIg = $("#pied-ig"); lienIg.href = igUrl; lienIg.textContent = "@" + SITE.instagram;
/* Menu et logo posés sur la photo d'accueil : blanc ou noir selon l'image */
function couleurs(menuBlanc, logoBlanc){
  const r = document.documentElement.style;
  r.setProperty("--menu-photo", menuBlanc ? "#FFFFFF" : "var(--encre)");
  r.setProperty("--logo-photo", logoBlanc ? "#FFFFFF" : "var(--encre)");
  document.body.classList.toggle("menu-blanc", menuBlanc);
  document.body.classList.toggle("logo-blanc", logoBlanc);
}
/* Luminosité moyenne (0 = noir, 1 = blanc) d'une zone de l'image */
function luminosite(img, y0, y1, x0 = 0, x1 = 1){
  const c = document.createElement("canvas"); c.width = 40; c.height = 40;
  const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, 40, 40);
  const d = ctx.getImageData(Math.round(x0*40), Math.round(y0*40), Math.max(1, Math.round((x1-x0)*40)), Math.max(1, Math.round((y1-y0)*40))).data;
  let s = 0; for (let i = 0; i < d.length; i += 4) s += (0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2]) / 255;
  return s / (d.length / 4);
}
function ajusterCouleurs(){
  if (SITE.couleurSurPhoto === "blanc") return couleurs(true, true);
  if (SITE.couleurSurPhoto === "noir") return couleurs(false, false);
  const img = document.getElementById("bandeau-img");
  if (!img) return couleurs(true, true);
  const calc = () => {
    try { couleurs(luminosite(img, 0, .2) < .6, luminosite(img, .3, .7, .3, .7) < .6); }
    catch (e) { couleurs(true, true); }
  };
  img.complete ? calc() : img.addEventListener("load", calc, {once:true});
}
const entete = document.querySelector("header");
const mesure = () => document.documentElement.style.setProperty("--h-header", entete.offsetHeight + "px");
const defile = () => {
  const b = document.querySelector(".bandeau");
  document.body.classList.toggle("defile", !!b && window.scrollY > b.offsetHeight - entete.offsetHeight - 4);
};
window.addEventListener("resize", () => { mesure(); defile(); });
window.addEventListener("scroll", defile, {passive:true});

window.addEventListener("hashchange", route);
route();
mesure(); defile();
</script>
