/* Layout : une colonne sobre, grille produits 2→3→4, fiche produit en deux colonnes (galerie / infos collantes) */
:root{
  /* ——— COULEURS (modifiables) ——— */
  --fond:#ECE9E4;
  --encre:#1E1E1E;
  --olive:#9E973C;
  --rose:#E0AFA4;
  --doux:#5f5b55;            /* texte secondaire */
  --menu-photo:#FFFFFF;      /* couleur du menu posé sur la photo d'accueil */
  --logo-photo:#FFFFFF;      /* couleur du logo au centre de la photo */
  --ligne:var(--doux);  /* traits gris = même gris que les textes */           /* filets */
  --cadre:var(--doux);          /* encadrement des menus déroulants */
  --filet:0.5px solid var(--encre); /* séparateurs fins, noirs comme le texte */
  --tuile-1:#e2ddd5; --tuile-2:#e6cfc8; --tuile-3:#d9d6bf;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--fond);color:var(--encre);font-family:var(--police-texte);font-weight:var(--poids-texte);font-size:var(--taille-texte);line-height:1.55;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
.caps{font-family:var(--police-titre);text-transform:uppercase;letter-spacing:var(--espacement-titre);font-weight:var(--poids-titre)}
.compo{display:flex;gap:12px;align-items:baseline;margin:0;font-size:var(--taille-petit);color:var(--doux)}
.compo .caps{font-size:.72rem;color:var(--encre)}
#finition-note{margin:0;color:var(--doux);font-size:var(--taille-petit)}
#finition-note:empty,#format-detail:empty{display:none}
.brouillon{font-family:var(--police-texte);font-style:italic;text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--doux);border:0.5px dashed var(--doux);padding:1px 8px;border-radius:999px;vertical-align:middle}
.coll-texte p.intro + p.intro{margin-top:-4px}
/* Logo (image en masque : prend la couleur du texte) */
.logo{display:block;flex:none;aspect-ratio:146/108;background-color:currentColor;-webkit-mask:var(--logo-img) center/contain no-repeat;mask:var(--logo-img) center/contain no-repeat}
.ph-photo{background:var(--tuile-1)}
.ph-vide{background:#D9D6D1}
.ph-vide span{font-family:var(--police-texte);font-style:italic;font-weight:300;font-size:.9rem;color:var(--doux)}
.ph-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
/* Prix */
.apd{font-family:var(--police-prix);font-style:italic;font-weight:300;font-size:1em;letter-spacing:.02em;color:var(--doux)}
.carte-prix b,.prix-tete b,.opt b{font-family:var(--police-prix);font-weight:var(--poids-prix);font-style:var(--style-prix);font-variant-numeric:tabular-nums;letter-spacing:.02em}
em,.detail{font-style:italic;font-weight:300}
strong,b{font-weight:var(--poids-fort)}
:focus-visible{outline:1.5px solid var(--encre);outline-offset:3px}

/* Bandeau d'annonce (partout sauf sur l'accueil) */
body.accueil .annonce{display:none}
.annonce{background:var(--encre);color:#FFFFFF;text-align:center;font-family:var(--police-titre);font-weight:300;text-transform:uppercase;letter-spacing:.12em;font-size:.66rem;line-height:1.5;padding-block:8px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));text-wrap:balance}
/* En-tête */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fond);color:var(--encre);border-bottom:0.5px solid var(--ligne);transition:background .3s,color .3s,border-color .3s}
/* Favoris */
.droite{display:flex;align-items:center;gap:22px;min-width:0}
.fav-lien{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;flex:none;font-size:.82rem;padding-block:4px;border-bottom:0.5px solid transparent}
.fav-lien:hover,.fav-lien[aria-current="page"]{border-bottom-color:currentColor}
.fav-ico{position:relative;display:grid;place-items:center}
.fav-lien svg{width:1.12em;height:1.12em;fill:none;stroke-width:1.4;margin-top:-.08em}  /* cœur à la hauteur des capitales, trait ≈ Jost light */
.fav-n{font-family:var(--police-titre);font-weight:300;letter-spacing:var(--espacement-titre);font-size:1em}
.fav-lien.a-favs .fav-ico svg{display:none}
.fav-lien.a-favs{gap:.4em}
@media (max-width:560px){.fav-lien.a-favs .fav-ico{display:flex;align-items:center;gap:.3em}.fav-lien.a-favs .fav-ico svg{display:block}}
.carte-box{position:relative;min-width:0}
/* défilement des photos dans la vignette */
.ph-rail{display:flex;aspect-ratio:4/5;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;transition:opacity .25s}
.ph-rail::-webkit-scrollbar{display:none}
.ph-rail > .ph{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:auto;height:100%}
.carte:hover .ph-rail{opacity:.85}
.carte:hover .ph-rail .ph{opacity:1}
.carte-nav{position:absolute;left:0;right:0;top:0;aspect-ratio:4/5;pointer-events:none}
.carte-fleche{all:unset;pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;color:#FFFFFF;cursor:pointer;opacity:0;transition:opacity .2s}
.carte-fleche svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.2;filter:drop-shadow(0 0 2px rgba(0,0,0,.35))}
.carte-fleche.g{left:8px}.carte-fleche.d{right:8px}
.carte-fleche[hidden]{display:none}
.carte-box:hover .carte-fleche,.carte-fleche:focus-visible{opacity:1}
.carte-fleche:focus-visible{outline:1.5px solid #FFFFFF;outline-offset:2px}
@media (hover:none){.carte-fleche{display:none}}
.carte-points{display:none}
.carte-points i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 2px rgba(0,0,0,.25)}
.carte-points i.on{background:#FFFFFF}
.fav{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;color:var(--encre)}
.fav svg{width:18px;height:18px;fill:none;stroke-width:1.3;transition:fill .15s}
.fav.on svg{fill:var(--rose)}
.fav-large.on svg{fill:var(--encre);stroke:var(--encre)}
.fav-coin.on svg{fill:#fff}
.fav:focus-visible{outline:1.5px solid var(--encre);outline-offset:2px}
.fav-coin{position:absolute;top:4px;right:4px;width:34px;height:34px;justify-content:center;color:#fff}
.fav-coin svg{width:22px;height:22px;filter:drop-shadow(0 0 2px rgba(0,0,0,.3))}
.fav-large{justify-content:center;border:var(--filet);padding:14px 20px;font-size:.85rem}
.fav-large .caps{font-size:.8rem}
.fav-cta{display:inline-flex;margin-top:18px}
.fiche-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.fiche-actions .cta,.fiche-actions .fav-large{flex:1 1 auto;white-space:nowrap;padding:15px 12px;gap:8px;font-size:.72rem}.fiche-actions .fav-large .caps{font-size:inherit}.fiche-actions svg{width:16px;height:16px}
.fav-intro:has(.lien-jost){display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap}.fav-intro p{margin:0}
header .bar{position:relative}
@media (max-width:1180px) and (min-width:761px){header nav ul{flex-wrap:nowrap;white-space:nowrap;gap:6px 14px;font-size:clamp(.66rem,1.05vw,.82rem)}header .fav-lien{font-size:clamp(.66rem,1.05vw,.82rem)}header .droite{gap:14px}header .marque{gap:12px}header .marque span{font-size:clamp(.7rem,1.2vw,.95rem)}header .marque .logo{width:24px}}
@media (max-width:880px) and (min-width:761px){header nav ul{gap:6px 10px;font-size:.62rem}header .fav-lien{font-size:.62rem}header .marque span{font-size:.66rem}header .bar{gap:12px}header .droite{gap:10px}header .marque{gap:8px}}
.outils{display:flex;align-items:center;gap:18px;flex:none}
.rech-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;color:inherit;font-size:.82rem;padding-block:4px}
.rech-btn svg{width:1.25em;height:1.25em;stroke-width:1.4}
.rech-btn:focus-visible{outline:1.5px solid currentColor;outline-offset:3px}
.rech{border-top:0.5px solid var(--ligne);background:var(--fond);color:var(--encre)}
.rech-in{display:flex;align-items:center;gap:12px;padding-block:12px}
.rech-in svg{width:18px;height:18px;stroke-width:1.4;flex:none}
.rech-in input{flex:1;min-width:0;border:0;border-bottom:var(--filet);background:transparent;color:var(--encre);border-radius:0;padding:8px 2px;font-family:var(--police-titre);font-weight:300;font-size:1rem;letter-spacing:.03em;-webkit-appearance:none;appearance:none}
.rech-in input::placeholder{color:var(--doux);font-family:var(--police-titre);font-weight:300;font-style:normal;letter-spacing:.03em;opacity:1}
.rech-in input:focus{outline:none;border-bottom-color:var(--encre)}
.rech-in input::-webkit-search-cancel-button{display:none}
.rech-fermer{all:unset;cursor:pointer;font-family:var(--police-titre);font-weight:300;font-size:.7rem;letter-spacing:var(--espacement-titre);text-transform:uppercase;color:var(--doux)}
.rech-fermer:focus-visible{outline:1.5px solid var(--encre);outline-offset:2px}
body.accueil header:has(.rech:not([hidden])){background:var(--fond);color:var(--encre);border-bottom-color:var(--ligne)}

/* Page favoris en panier */
.panier{padding-bottom:clamp(48px,8vw,96px)}
.panier-entete,.panier-ligne{grid-template-columns:96px minmax(0,1fr) 170px 190px 110px 90px;gap:20px}
.panier-entete{display:grid;font-size:.72rem;color:var(--doux);padding-bottom:10px;border-bottom:var(--filet)}
.panier-entete span:first-child{grid-column:1 / 3}.panier-entete span:nth-child(4){text-align:center}.panier-entete span:nth-child(5){text-align:right}
.panier-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.panier-col .select select{padding:9px 32px 9px 10px;font-size:.8rem}
.panier-col .select::after{right:12px;width:6px;height:6px}
.panier-tiret{color:var(--doux)}
@media (max-width:1000px){.panier-entete,.panier-ligne{grid-template-columns:72px minmax(0,1fr) 120px 140px 100px 76px;gap:14px}}
.panier-liste{list-style:none;margin:0;padding:0}
.panier-ligne{display:grid;align-items:start;padding:22px 0;border-bottom:0.5px solid var(--ligne)}
.panier-photo{display:block;text-decoration:none}
a:has(.ph){text-decoration:none} /* pas de soulignement noir sous « Photo à venir » */
a,button{text-decoration-color:currentColor;text-decoration-thickness:0.5px} /* soulignement : même couleur et même finesse que le trait des lettres */.panier-photo .ph{aspect-ratio:4/5}
.panier-infos{display:flex;flex-direction:column;gap:10px;min-width:0}
.panier-nom{text-decoration:none;font-size:.9rem}
.panier-detail{margin:0;font-size:var(--taille-petit);color:var(--doux);font-style:italic}
.panier-choix{display:flex;flex-wrap:wrap;gap:8px}
.panier-choix .select{flex:1 1 180px;max-width:320px}
.panier-choix select{padding:9px 36px 9px 10px;font-size:.8rem}
.panier-choix .select::after{right:12px;width:6px;height:6px}
.panier-liens{display:flex;gap:18px}
.panier-retirer{all:unset;cursor:pointer;align-self:flex-start;font-family:var(--police-titre);font-weight:300;font-size:.7rem;letter-spacing:var(--espacement-titre);text-transform:uppercase;color:var(--doux);text-decoration:underline;text-underline-offset:3px}
.panier-qte{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--police-titre);font-weight:300}
.panier-qte button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border:var(--filet);border-radius:999px;font-size:1rem;line-height:1}
.panier-qte button:disabled{opacity:.3;cursor:default}
/* − et + dessinés en CSS : parfaitement centrés dans le rond */
.panier-qte button{position:relative;font-size:0;color:var(--encre)}
.panier-qte button::before,.panier-qte button::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:0.5px;background:currentColor;transform:translate(-50%,-50%)}
.panier-qte button[data-moins]::after{display:none}
.panier-qte button[data-plus]::after{width:0.5px;height:10px}
.panier-qte span{min-width:28px;text-align:center}
.panier-qte button:focus-visible,.panier-retirer:focus-visible{outline:1.5px solid var(--encre);outline-offset:2px}
.panier-prix{margin:0;text-align:right;font-size:.95rem}
.panier-barre{color:var(--doux);font-family:var(--police-prix);font-weight:300;font-style:italic;font-size:.85em;text-decoration-thickness:0.5px}
.panier-lot{display:block;margin-top:4px;font-family:var(--police-texte);font-style:italic;font-size:.75rem;color:var(--doux);line-height:1.35}.panier-prix b{white-space:nowrap}
.panier-prix b,.panier-somme b{font-family:var(--police-prix);font-weight:300;font-style:italic}
.panier-total{display:flex;justify-content:flex-end;align-items:baseline;gap:18px;padding:22px 0 6px;border-top:var(--filet);margin-top:-1px}
.panier-total p{margin:0}
.panier-livraison{display:flex;justify-content:flex-end;align-items:baseline;gap:18px;padding:18px 0;border-bottom:0.5px solid var(--ligne)}
.panier-livraison p{margin:0}.panier-livraison .caps{font-size:.85rem}
.panier-liv-texte{font-family:var(--police-texte);font-style:italic;color:var(--doux);font-size:var(--taille-petit);text-align:right}.panier-total .caps{font-size:1.25rem}
.panier-somme{font-size:1.25rem}
.panier-note{margin:4px 0 0;font-size:var(--taille-petit);color:var(--doux);font-style:italic;text-align:right}
.panier-actions{margin-top:44px;margin-left:auto;max-width:420px;display:flex;flex-direction:column;gap:14px}
.panier-actions .cta-note{margin:0}
@media (max-width:700px){
  .panier-entete{display:none}
  .panier-ligne{grid-template-columns:80px minmax(0,1fr);grid-template-areas:"photo infos" "photo coul" "photo format" "photo qte" "photo prix";gap:10px 16px}
  .panier-photo{grid-area:photo}.panier-infos{grid-area:infos}.panier-c-coul{grid-area:coul}.panier-c-format{grid-area:format}.panier-qte{grid-area:qte;justify-content:flex-start}.panier-prix{grid-area:prix;text-align:left}
  .panier-col:has(.panier-tiret){display:none}
  .panier-actions{max-width:none}
}
/* Accueil : menu transparent posé sur la photo, redevient opaque au défilement */
body.accueil main{margin-top:calc(-1 * var(--h-header,64px))}
body.accueil header{background:transparent;color:var(--menu-photo);border-bottom-color:transparent}
body.accueil.defile header{background:var(--fond);color:var(--encre);border-bottom-color:var(--ligne)}
body.accueil.menu-blanc .bandeau-photo::before{content:none}
header .bar{max-width:none;padding-inline:clamp(16px,3vw,40px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.marque{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.marque .logo{width:28px}
.marque span{font-size:.95rem;line-height:1.2;white-space:nowrap}
@media (max-width:420px){.marque{gap:10px}.marque .logo{width:24px}.marque span{font-size:.8rem}}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.82rem}
nav a{text-decoration:none;padding-block:4px;border-bottom:0.5px solid transparent}
nav a:hover,nav a[aria-current="page"]{border-bottom-color:currentColor}
/* Menu burger (mobile) */
.burger{display:none}
@media (max-width:760px){
  .bar{padding-block:14px;min-height:30px}
  .burger{all:unset;cursor:pointer;display:inline-flex;flex-direction:column;justify-content:center;gap:5px;width:22px;height:22px;color:inherit}
  .burger span{display:block;height:0.5px;background:currentColor;transition:transform .2s,opacity .2s}
  header.menu-ouvert .burger span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
  header.menu-ouvert .burger span:nth-child(2){opacity:0}
  header.menu-ouvert .burger span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}
  .burger:focus-visible{outline:1.5px solid currentColor;outline-offset:3px}
  header nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--fond);color:var(--encre);border-bottom:0.5px solid var(--ligne);padding:4px clamp(16px,3vw,40px) 16px}
  header.menu-ouvert nav{display:block}
  header nav ul{flex-direction:column;flex-wrap:nowrap;gap:0;font-size:.85rem}
  header nav li a{display:block;padding:14px 0;border-bottom:0.5px solid var(--ligne)}
  header nav a:hover,header nav a[aria-current="page"]{border-bottom-color:var(--ligne)}
  header nav a[aria-current="page"]{text-decoration:underline;text-decoration-thickness:0.5px;text-underline-offset:4px}
  body.accueil header.menu-ouvert{background:var(--fond);color:var(--encre);border-bottom-color:var(--ligne)}
}

/* Accueil : bandeau photo pleine largeur, logo blanc centré */
.bandeau{position:relative;height:clamp(280px,52vw,640px);overflow:hidden;display:grid;place-items:center}
.bandeau-photo{position:absolute;inset:0;background:linear-gradient(160deg,#a9a273 0%,var(--olive) 45%,#7d7731 100%)}
.bandeau-photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transform:translate(-5%,7%) scale(1.33);transform-origin:center} /* zoom, image descendue de 20 %, bouquet recentré */
.bandeau-photo::after{content:"";position:absolute;inset:0;background:rgba(30,30,30,.12)}
.bandeau-photo i{position:absolute;left:clamp(16px,4vw,48px);bottom:14px;font-size:.75rem;color:rgba(255,255,255,.75);z-index:1}
.bandeau-logo{position:relative;z-index:1;width:clamp(132px,19.2vw,240px);color:var(--logo-photo);transition:color .3s}
body:not(.logo-blanc) .bandeau-photo::after{background:rgba(236,233,228,.12)}
/* Accueil */
/* Intro d'accueil : accroche en tête, puis texte éditorial (gauche) et infos pratiques (droite) */
/* Intro d'accueil : bandeau centré, titre 1/3 et texte 2/3 de même hauteur, centrés verticalement */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(20px,3vw,32px) clamp(28px,5vw,64px);align-items:center;padding-block:clamp(40px,7vw,88px) clamp(28px,5vw,56px)}
/* décalage d'environ 1 cm par rapport au séparateur des sections */
.intro > *{margin-inline:0}
.intro h1{padding-left:1cm}
.intro-texte{margin-right:1cm}
.intro h1{font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.2;margin:0;text-wrap:balance}
.intro-texte{display:flex;flex-direction:column;gap:10px;min-width:0;padding-left:clamp(20px,3vw,40px);border-left:0.5px solid var(--ligne)}
.intro .chapeau{margin:0;font-size:clamp(1.05rem,1.45vw,1.2rem);line-height:1.5;color:var(--encre);text-wrap:pretty}
.intro .pratique{margin:0;font-style:italic;font-weight:300;font-size:.95rem;color:var(--doux)}
.intro .logo-xl{width:clamp(90px,14vw,150px);height:auto;margin-bottom:28px;display:block}
@media (max-width:760px){.intro{grid-template-columns:1fr;align-items:start}.intro-texte{padding-left:0;border-left:0;margin-right:0}.intro h1{padding-left:0}}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:clamp(40px,7vw,80px)}
.cat{position:relative;display:block;text-decoration:none;overflow:hidden}
.cat .ph{aspect-ratio:3/4}
/* nom de la catégorie posé sur la photo, en bas à gauche */
.cat::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(20,20,20,.35));pointer-events:none}
.cat-nom{position:absolute;left:clamp(12px,1.8vw,24px);right:clamp(12px,1.8vw,24px);bottom:clamp(12px,1.8vw,22px);z-index:1;display:flex;flex-direction:column;gap:4px;color:#FFFFFF;font-size:clamp(1.1rem,2.3vw,2rem);line-height:1.1}
.cat-nom .n{font-family:var(--police-prix);font-style:italic;font-weight:300;letter-spacing:.02em;text-transform:none;color:rgba(255,255,255,.85);font-size:.8rem}
@media (max-width:600px){.cats{gap:8px}.cat-nom{gap:2px;font-size:.8rem;left:8px;right:8px;bottom:8px}.cat-nom .n{font-size:.68rem}}

/* Collections : une seule ligne qui défile vers la droite */
.colls{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 2 * 18px) / 2.6);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:clamp(40px,7vw,80px)}
.colls::-webkit-scrollbar{display:none}
.colls > .coll{scroll-snap-align:start}
@media (max-width:860px){.colls{grid-auto-columns:78%}}
.defil{display:flex;gap:6px}
.defil button{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border:0.5px solid var(--encre);border-radius:999px;font-family:var(--police-titre);font-size:.9rem;line-height:1}
.defil button:hover{background:var(--encre);color:var(--fond)}
.defil button:focus-visible{outline:1.5px solid var(--encre);outline-offset:2px}
.defil button[disabled]{opacity:.25;pointer-events:none}
.coll{display:flex;flex-direction:column;gap:12px;text-decoration:none;min-width:0}
.coll .ph{aspect-ratio:4/3}
.coll:hover .ph{opacity:.85}
/* nom de la collection posé sur la photo, en bas à gauche */
.coll-photo{position:relative;overflow:hidden}
.coll-photo::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(20,20,20,.35));pointer-events:none}
.coll h3{position:absolute;left:clamp(12px,1.8vw,22px);right:clamp(12px,1.8vw,22px);bottom:clamp(12px,1.8vw,20px);z-index:1;margin:0;display:flex;flex-direction:column;gap:4px;color:#FFFFFF;font-size:clamp(1.1rem,2.1vw,1.9rem);line-height:1.1}
.coll h3 .n{font-family:var(--police-prix);font-style:italic;font-weight:300;letter-spacing:.02em;text-transform:none;color:rgba(255,255,255,.85);font-size:.8rem}
.coll p{margin:0;color:var(--doux);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.coll-tete{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;padding-block:24px clamp(36px,6vw,64px)}
.coll-tete .ph{aspect-ratio:4/3}
.coll-texte{display:flex;flex-direction:column;gap:14px}
.coll-texte .eyebrow{font-size:.75rem;color:var(--doux)}
.coll-texte h1{font-size:var(--taille-titre);margin:0;line-height:1.1}
.coll-texte p.intro{margin:0;font-size:1.15rem;line-height:1.6;max-width:46ch}
@media (max-width:860px){.coll-tete{grid-template-columns:1fr}}
/* Sous-catégories */
.sous{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:24px}
.sous a{text-decoration:none;border:0.5px solid var(--encre);padding:4px 11px;border-radius:999px;font-size:.66rem}
.sous a:hover{background:var(--rose);border-color:var(--rose)}
.sous a[aria-current="page"]{background:var(--encre);color:var(--fond);border-color:var(--encre)}

/* Lignes : 1 modèle = 3 photos côte à côte */
.lignes{display:flex;flex-direction:column;gap:clamp(44px,7vw,80px);padding-bottom:clamp(48px,8vw,96px)}
.ligne{display:flex;flex-direction:column;gap:14px;text-decoration:none}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1vw,14px)}
.trio .ph{aspect-ratio:4/5}
.ligne:hover .ph{opacity:.88}
.ligne .carte-nom{font-size:.95rem}
.ligne .carte-prix{font-size:.85rem}

/* Page Collections : texte puis 3 photos */
.coll-ligne{display:flex;flex-direction:column;gap:22px;border-top:var(--filet);padding-top:clamp(28px,4vw,44px)}
.coll-ligne-texte{display:flex;flex-direction:column;gap:10px;max-width:60ch}
.coll-ligne-texte h2{font-size:clamp(1.2rem,2vw,1.5rem);margin:0}
.coll-ligne-texte p{margin:0}
.coll-ligne-texte a.voir{font-size:var(--taille-petit);color:var(--doux)}
.coll-ligne a.trio{text-decoration:none}
.coll-ligne-tete{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.coll-ligne-tete h2{font-size:clamp(1.2rem,2vw,1.5rem);margin:0}
.coll-ligne-bas{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.coll-ligne-bas a.voir{white-space:nowrap;line-height:1.55}
.coll-ligne-tete a.voir{font-size:var(--taille-petit);color:var(--doux);white-space:nowrap}
.coll-ligne .grille-3{grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:0}
@media (max-width:700px){.coll-ligne .grille-3{grid-template-columns:repeat(2,minmax(0,1fr))}.coll-ligne .grille-3 > :nth-child(3){display:none}}

.section-tete{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:var(--filet);padding-top:14px;margin-bottom:24px}
.section-tete h2{font-size:1rem;margin:0}
.lien-jost,.section-tete .detail,.coll-ligne-tete a.voir,.coll-ligne-bas a.voir{font-family:var(--police-titre);font-style:normal;font-weight:300;text-transform:uppercase;letter-spacing:var(--espacement-titre);font-size:.72rem;color:var(--doux)}

/* Grille produits */
.grille{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 18px;padding-bottom:clamp(48px,8vw,96px)}
@media (max-width:1000px){.grille{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.grille{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 12px}.grille .carte-ligne{flex-direction:column;gap:2px}.grille .carte-prix{text-align:left}}
.carte{display:flex;flex-direction:column;gap:12px;text-decoration:none;min-width:0}
.carte .ph{aspect-ratio:4/5;transition:opacity .25s}
.carte:hover .ph{opacity:.85}
.carte-ligne{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.carte-nom{font-size:.85rem;margin:0;min-width:0}
.carte-prix{font-size:.78rem;margin:0;color:var(--doux);white-space:nowrap;flex:none;text-align:right}
.carte-prix b{color:var(--doux);font-weight:300}

/* Emplacements photo */
.ph{position:relative;width:100%;max-width:100%;display:grid;place-items:center;overflow:hidden}
.ph.t1{background:var(--tuile-1)}.ph.t2{background:var(--tuile-2)}.ph.t3{background:var(--tuile-3)}
.ph .logo{width:22%;max-width:90px;opacity:.18}
.ph i{position:absolute;left:12px;bottom:10px;font-size:.75rem;color:var(--doux)}

/* Page catégorie */
.page-tete{padding-block:clamp(36px,6vw,72px) clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:12px}
.page-tete h1{font-size:var(--taille-titre);margin:0;line-height:1.1}
.page-tete p{margin:0;color:var(--doux);max-width:56ch}
.coll-intro{display:flex;flex-direction:column;gap:10px;max-width:none}
.page-tete .coll-intro p{color:var(--encre);max-width:none}
.fil{font-family:var(--police-titre);font-weight:300;text-transform:uppercase;letter-spacing:var(--espacement-titre);font-size:.7rem;color:var(--doux)}
.fil a{text-decoration:none}.fil a:hover{text-decoration:underline}

/* Fiche produit */
.fiche{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);padding-block:28px clamp(48px,8vw,96px);align-items:start}
@media (max-width:860px){.fiche{grid-template-columns:1fr}}
.galerie{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}

.vignettes button{all:unset;cursor:pointer;display:block;outline-offset:2px}
.vignettes .ph{aspect-ratio:4/5;opacity:.55;transition:opacity .2s}
.vignettes button[aria-current="true"] .ph,.vignettes button:hover .ph{opacity:1}
.vignettes button:focus-visible{outline:1.5px solid var(--encre)}
.vignettes .ph .logo{width:40%}
.vignettes .ph i{display:none}
.principale .ph{aspect-ratio:4/5}
@media (max-width:860px){
  .galerie{grid-template-columns:1fr}
  .vignettes{flex-direction:row;order:2;overflow-x:auto}
  .vignettes button{width:64px;flex:none}
}
.infos{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:860px){.infos{position:static}}
.infos h1{font-size:clamp(1.5rem,2.6vw,2rem);margin:0;line-height:1.15}
.fiche-tete{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.fiche-tete h1{min-width:0}
.prix-tete{font-size:1.05rem;margin:0;white-space:nowrap;flex:none}
.desc{margin:0;max-width:52ch}
.options{border-top:0.5px solid var(--ligne)}
.options h2{font-size:.78rem;margin:14px 0 6px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding-block:10px;border-bottom:0.5px solid var(--ligne);font-variant-numeric:tabular-nums}
.opt .detail{grid-column:1;color:var(--doux);font-size:var(--taille-petit)}
.opt b{grid-row:1;grid-column:2;text-align:right}
.choix{display:flex;flex-direction:column;gap:8px}
.choix label,.choix-titre{font-size:.78rem}
.choix-titre{margin:0;display:flex;gap:10px;align-items:baseline}
.coul-nom{font-family:var(--police-titre);font-weight:300;text-transform:none;letter-spacing:.02em;color:var(--doux)}
.pastilles{display:flex;flex-wrap:wrap;gap:12px;padding:4px 3px}
.pastille{width:28px;height:28px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.28);transition:box-shadow .15s}
.pastille:hover{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.28),0 0 0 3px var(--fond),0 0 0 3.5px var(--doux)}
.pastille[aria-checked="true"]{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.28),0 0 0 3px var(--fond),0 0 0 3.5px var(--encre)}
.pastilles.petites{gap:9px}
.pastilles.petites .pastille{width:20px;height:20px}
.panier-coul{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.select{position:relative}
.select::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:0.5px solid var(--encre);border-bottom:0.5px solid var(--encre);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select select{appearance:none;-webkit-appearance:none;width:100%;background:var(--fond);color:var(--encre);border:0.5px solid var(--cadre);border-radius:0;padding:13px 44px 13px 14px;font-family:var(--police-titre);font-weight:300;font-size:.92rem;letter-spacing:.03em;cursor:pointer}
.riche-btn{all:unset;box-sizing:border-box;display:block;width:100%;background:var(--fond);color:var(--encre);border:0.5px solid var(--cadre);padding:13px 44px 13px 14px;font-family:var(--police-titre);font-weight:300;font-size:.92rem;letter-spacing:.03em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riche-btn:focus-visible{outline:1.5px solid var(--encre);outline-offset:2px}
.riche-liste{position:absolute;z-index:6;left:0;right:0;top:calc(100% - 1px);margin:0;padding:4px 0;list-style:none;background:var(--fond);border:var(--filet);max-height:320px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.06);border-color:var(--cadre)}
.riche-liste li{padding:10px 14px;font-family:var(--police-titre);font-weight:300;font-size:.9rem;letter-spacing:.03em;cursor:pointer}
.riche-liste li:hover,.riche-liste li:focus{background:rgba(0,0,0,.05);outline:none}
.riche-liste li[aria-selected="true"]{background:rgba(0,0,0,.08)}
em.taille{font-family:var(--police-texte);font-style:italic;font-weight:400;letter-spacing:0}
.format-unique{margin:-8px 0 0;font-size:var(--taille-petit)}
.panier-format{margin:0;font-family:var(--police-titre);font-weight:300;font-size:.85rem}
.panier-col .riche-btn{padding:9px 32px 9px 10px;font-size:.8rem}
.panier-col .riche-liste li{font-size:.8rem;padding:8px 10px}
.select select:focus-visible{outline:1.5px solid var(--encre);outline-offset:2px}
#format-detail{margin:0;color:var(--doux);font-size:var(--taille-petit);min-height:1.4em}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--encre);color:var(--fond);text-decoration:none;padding:16px 20px;font-size:.85rem;transition:background .2s}
.cta:hover{background:#3a3835}
.cta svg{width:18px;height:18px}
.cta-note{margin:-12px 0 0;font-size:var(--taille-petit);color:var(--doux)}
.aussi{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--police-titre);font-weight:300;text-transform:uppercase;letter-spacing:var(--espacement-titre);font-size:.72rem}
.aussi .detail{font-style:normal;color:var(--doux)}
.aussi a{text-decoration:none;border:0.5px solid var(--encre);padding:5px 12px;border-radius:999px}
.aussi a:hover{background:var(--rose);border-color:var(--rose)}
details{border-top:0.5px solid var(--ligne)}
details:last-of-type{border-bottom:0.5px solid var(--ligne)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding-block:14px;font-size:.8rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.1rem;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:0 0 16px;color:var(--doux);font-size:.95rem}

/* Pied de page */
footer{background:#E1DDD6;color:var(--encre)}
/* Footer toujours en bas de page, même quand le contenu est court */
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
body > main{flex:1 0 auto}
body > header,body > footer{flex:none}
.pied-tete{padding-top:44px}.pied-tete h2{font-size:1rem;margin:0}
.pied{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) max-content;gap:28px 40px;padding-block:48px 36px}
.pied h3{font-size:.95rem;margin:0 0 12px}
.pied p{margin:0;font-family:var(--police-titre);font-weight:300;font-size:.85rem;letter-spacing:.02em;line-height:1.6}
.pied .handle{user-select:all}
.pied .pied-lien{margin-top:12px}.pied .pied-lien a{font-family:var(--police-titre);font-weight:300;text-transform:uppercase;letter-spacing:var(--espacement-titre);font-size:.72rem;color:var(--encre)}
.credits{border-top:0.5px solid var(--doux);padding-block:16px;font-size:.8rem}
@media (max-width:1000px){.pied{grid-template-columns:repeat(3,minmax(0,1fr))}.pied > div:nth-child(4){grid-column:1 / -1}}
@media (max-width:760px){.pied{grid-template-columns:1fr}}

.vide{padding-block:80px;text-align:center;color:var(--doux)}
</style>

/* ——— Lecture des formats Notion ———
   « Nom | détail | prix » ou « Nom | prix », une ligne par format.
   « [Finition] note » ouvre un groupe. Si la première colonne se répète
   (ex. « Blanc à pois | Ø12 cm | 14 »), elle devient un choix de finition. */
function lireFormats(txt){
  const lignes = [];
  let groupe = null, note = "";
  String(txt || "").split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {
    const g = l.match(/^\[(.+?)\]\s*(.*)$/);
    if (g) { groupe = g[1].trim(); note = g[2].trim(); return; }
    const parts = l.split("|").map(s => s.trim());
    if (parts.length < 2 && !/^\d+([.,]\d+)?\s*€?$/.test(l)) return;
    const prix = parseFloat((parts.pop() || "").replace(",", "."));
    if (isNaN(prix)) return;
    const [a = "", ...reste] = parts; const b = reste.filter(Boolean).join(" · ");
    lignes.push({a, b, prix, groupe, note});
  });
  /* Deux niveaux ? (groupes entre crochets, ou première colonne répétée) */
  if (lignes.some(l => l.groupe)) {
    return {niveaux:2, lignes:lignes.map(l => ({fin:l.groupe || "", note:l.note, nom:l.a, detail:l.b, prix:l.prix}))};
  }
  const distinctA = new Set(lignes.map(l => l.a));
  if (lignes.length > 2 && lignes.every(l => l.b) && distinctA.size > 1 && distinctA.size < lignes.length) {
    return {niveaux:2, lignes:lignes.map(l => ({fin:l.a, note:"", nom:l.b, detail:"", prix:l.prix}))};
  }
  if (!lignes.length && String(txt || "").trim()) {
    /* aucun prix indiqué : on garde le texte comme dimensions, prix sur demande */
    return {niveaux:1, lignes:[{fin:"", note:"", nom:"", detail:String(txt).replace(/\|/g, " ").replace(/\s+/g, " ").trim(), prix:null}]};
  }
  return {niveaux:1, lignes:lignes.map(l => ({fin:"", note:"", nom:l.a, detail:l.b, prix:l.prix}))};
}

/* Menu déroulant « riche » : remplace l'affichage d'un <select data-riche> pour permettre l'italique.
   Le <select> reste la source de vérité (valeur, évènement change). */
function menusRiches(racine){
  (racine || document).querySelectorAll("select[data-riche]:not([data-pret])").forEach(sel => {
    sel.dataset.pret = "1";
    const boite = sel.parentElement; boite.classList.add("riche");
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "riche-btn";
    btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-label", sel.getAttribute("aria-label") || (sel.id && document.querySelector(`label[for="${sel.id}"]`) || {}).textContent || "Choisir");
    const liste = document.createElement("ul"); liste.className = "riche-liste"; liste.setAttribute("role", "listbox"); liste.hidden = true;
    const opts = [...sel.options];
    liste.innerHTML = opts.filter(o => !o.disabled).map(o => `<li role="option" tabindex="-1" data-v="${esc(o.value)}" aria-selected="${o.selected}">${o.dataset.html || esc(o.textContent)}</li>`).join("");
    const maj = () => { const o = sel.options[sel.selectedIndex]; btn.innerHTML = o ? (o.dataset.html || esc(o.textContent)) : ""; liste.querySelectorAll("li").forEach(li => li.setAttribute("aria-selected", li.dataset.v === sel.value)); };
    const fermer = () => { liste.hidden = true; btn.setAttribute("aria-expanded", "false"); };
    const ouvrir = () => { liste.hidden = false; btn.setAttribute("aria-expanded", "true"); (liste.querySelector('[aria-selected="true"]') || liste.firstElementChild).focus(); };
    const choisir = li => { sel.value = li.dataset.v; maj(); fermer(); btn.focus(); sel.dispatchEvent(new Event("change", {bubbles: true})); };
    btn.addEventListener("click", () => liste.hidden ? ouvrir() : fermer());
    liste.addEventListener("click", e => { const li = e.target.closest("li"); if (li) choisir(li); });
    liste.addEventListener("keydown", e => {
      const li = document.activeElement.closest("li"); if (!li) return;
      if (e.key === "ArrowDown") { e.preventDefault(); (li.nextElementSibling || li).focus(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); (li.previousElementSibling || li).focus(); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choisir(li); }
      else if (e.key === "Escape" || e.key === "Tab") { fermer(); btn.focus(); }
    });
    document.addEventListener("click", e => { if (!boite.contains(e.target)) fermer(); });
    sel.hidden = true; sel.tabIndex = -1;
    boite.append(btn, liste); maj();
  });
}

/* Sélection de l'accueil : 2 lignes de 4. Plus tard, les pièces les plus consultées (liste SITE.populaires) ;
   en attendant, les premières pièces de chaque catégorie, en privilégiant celles qui ont une photo. */
function selectionAccueil(){
  const max = 8, choix = [];
  (SITE.populaires || []).forEach(id => { const p = PIECES.find(x => x.id === id); if (p && !choix.includes(p)) choix.push(p); });
  /* Catégories en alternance (table, vases, objets, table…) pour ne jamais avoir deux voisins de la même catégorie */
  const files = ["table", "vases", "objets"].map(cat => PIECES.filter(p => p.cats.includes(cat) && !choix.includes(p))
    .sort((x, y) => (y.photos.length > 0) - (x.photos.length > 0)));
  for (let tour = 0; choix.length < max && files.some(f => f.length); tour++) {
    const f = files[tour % files.length];
    while (f.length && choix.includes(f[0])) f.shift();
    if (f.length) choix.push(f.shift());
  }
  return choix.slice(0, max);
}

/* Réordonne une liste pour éviter deux voisins de même clé ; les pièces sans photo restent en fin de liste */
function melanger(liste, cle, cleSans = cle){
  const passe = (groupe, cle) => {
    const reste = groupe.slice(), out = [];
    while (reste.length) {
      const prec = out.length ? cle(out[out.length - 1]) : null;
      /* on prend en priorité la clé la plus représentée parmi celles différentes du voisin */
      const cand = reste.filter(p => cle(p) !== prec);
      const pool = cand.length ? cand : reste;
      const compte = k => reste.filter(p => cle(p) === k).length;
      const choix = pool.reduce((m, p) => compte(cle(p)) > compte(cle(m)) ? p : m, pool[0]);
      out.push(choix); reste.splice(reste.indexOf(choix), 1);
    }
    return out;
  };
  const avec = passe(liste.filter(p => p.photos.length), cle), sans = liste.filter(p => !p.photos.length);
  /* le premier « sans photo » ne doit pas répéter la catégorie du dernier « avec photo » */
  const suite = passe(sans, cleSans);
  if (avec.length && suite.length > 1 && cle(suite[0]) === cle(avec[avec.length - 1])) {
    const j = suite.findIndex(p => cle(p) !== cle(avec[avec.length - 1]));
    if (j > 0) suite.unshift(suite.splice(j, 1)[0]);
  }
  return avec.concat(suite);
}

function categorie(id, sousId){

  if (s) liste = liste.filter(p => p.sous === s.id);
  /* Mélange : jamais deux pièces de la même catégorie (ou sous-catégorie) côte à côte */
  if (id === "tout") liste = melanger(liste, p => p.cats[0], p => p.sous || p.cats[0]);
  else if (!s && c && c.sous) liste = melanger(liste, p => p.sous || "autre");

/* ---------- Favoris (wishlist) : gardés dans le navigateur du visiteur, rien n'est envoyé ----------
   Chaque favori : {id, opt, coul, qte} — opt = index du format, coul = index de la couleur (null = à choisir), qte ≥ 1 */
const CLE_FAV = "vtc-favoris";
let FAVORIS = (() => {
  try {
    return JSON.parse(localStorage.getItem(CLE_FAV) || "[]")
      .map(f => typeof f === "string" ? {id: f, opt: null, qte: 1} : f)
      .filter(f => f && PIECES.some(p => p.id === f.id))
      .map(f => { const p = PIECES.find(q => q.id === f.id); return {id: f.id, opt: (f.opt != null && p.f.lignes[f.opt]) ? f.opt : (p.f.lignes.length === 1 ? 0 : null), coul: (f.coul != null && p.coul[f.coul]) ? f.coul : (p.coul.length === 1 ? 0 : null), qte: Math.max(1, +f.qte || 1)}; });
  } catch (e) { return []; }
})();
const estFav = id => FAVORIS.some(f => f.id === id);
const favDe = id => FAVORIS.find(f => f.id === id);
function sauverFav(){ try { localStorage.setItem(CLE_FAV, JSON.stringify(FAVORIS)); } catch (e) {} majCompteurFav(); }
function largeurOutils(){ const o = document.querySelector(".outils"); if (o) document.documentElement.style.setProperty("--l-outils", (o.offsetWidth + 14) + "px"); }
window.addEventListener("resize", largeurOutils);
function majCompteurFav(){
  const n = $("#fav-n"), l = document.querySelector(".fav-lien"), k = FAVORIS.length;
  if (n) { n.textContent = k ? `(${k})` : ""; n.hidden = !k; }
  requestAnimationFrame(largeurOutils);
  if (l) { l.classList.toggle("a-favs", k > 0); l.setAttribute("aria-label", k ? `Mes favoris : ${k} pièce${k > 1 ? "s" : ""}` : "Mes favoris"); }
}
/* Libellé d'un format, sans le prix : « Marbré brun · Ø20 cm » */
const libelleFormat = (p, i) => { const l = p.f.lignes[i]; return [l.fin, l.nom, l.detail].map(x => String(x || "").replace(/\*/g, "").trim()).filter(Boolean).join(" · "); };
function boutonFav(p, style){
  const on = estFav(p.id);
  const label = style === "large" ? `<span class="caps">${on ? "Ajouté à mes favoris" : "Ajouter aux favoris"}</span>` : "";
  return `<button type="button" class="fav fav-${style}${on ? " on" : ""}" data-fav="${p.id}" aria-pressed="${on}" aria-label="${on ? "Retirer des favoris" : "Ajouter aux favoris"} : ${esc(p.nom)}"><svg aria-hidden="true"><use href="#coeur"/></svg>${label}</button>`;
}
/* Couleur sélectionnée sur la fiche produit ouverte (si c'est cette pièce) */
function couleurSurFiche(p){
  const b = document.querySelector('.fiche [data-coul][aria-checked="true"]');
  if (location.hash === "#p-" + p.id && b) return +b.dataset.coul;
  return p.coul.length === 1 ? 0 : null;
}
const nomCouleur = (p, f) => f.coul != null && p.coul[f.coul] ? p.coul[f.coul].nom : "";
/* Format sélectionné sur la fiche produit ouverte (si c'est cette pièce) */
function formatSurFiche(p){
  const sel = $("#format");
  if (location.hash === "#p-" + p.id && sel && sel.value !== "") return +sel.value;
  return p.f.lignes.length === 1 ? 0 : null;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-fav]"); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const id = b.dataset.fav, p = PIECES.find(q => q.id === id);

  sauverFav();
  if (location.hash === "#favoris") return favorisPage();
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(x => { x.outerHTML = boutonFav(p, x.classList.contains("fav-large") ? "large" : "coin"); });
});
/* Sur la fiche produit : changer de format met à jour le favori */
document.addEventListener("change", e => {
  if (!e.target.matches("#format, #finition")) return;
  const id = location.hash.slice(3), f = favDe(id), sel = $("#format");
  if (location.hash.startsWith("#p-") && f && sel) { f.opt = +sel.value; sauverFav(); }
});

/* ---------- Page Favoris, présentée comme un panier ---------- */
function ligneFav(f, k){
  const p = PIECES.find(q => q.id === f.id), L = p.f.lignes;
  const fins = [...new Set(L.map(l => l.fin))];
  const deux = p.f.niveaux === 2 && fins.length > 1;
  const sansPrix = i => esc([L[i].nom, L[i].detail].filter(Boolean).join(" · ").replace(/\*/g, "") || "Format " + (i + 1));
  const vide = `<span class="panier-tiret" aria-hidden="true">—</span>`;
  /* Colonne couleur */
  let couleur = vide;
  if (p.coul.length) couleur = `${pastilles(p, f.coul, "data-coulfav-" + k, "petites")}<p class="panier-detail">${f.coul != null ? esc(nomCouleur(p, f)) : "À choisir"}</p>`;
  else if (deux) {
    const finActuelle = f.opt != null ? L[f.opt].fin : null;
    couleur = `<div class="select"><select data-fin="${k}" aria-label="Couleur de ${esc(p.nom)}">
        ${finActuelle == null ? `<option value="" selected disabled>Choisir</option>` : ""}
        ${fins.map(fi => `<option value="${esc(fi)}"${fi === finActuelle ? " selected" : ""}>${esc(fi)}</option>`).join("")}
      </select></div>`;
  }
  /* Colonne format */
  let format;
  if (L.length === 1) {
    const d = [L[0].nom, L[0].detail].filter(Boolean).join(" · ").replace(/\*/g, "");
    format = d && d !== p.nom ? `<p class="panier-format">${formatHtml(L[0], false)}</p>` : vide;
  } else {
    const ids = deux ? L.map((l, i) => i).filter(i => f.opt != null && L[i].fin === L[f.opt].fin) : L.map((l, i) => i);
    format = deux && f.opt == null ? `<p class="panier-detail">Choisir d'abord la couleur</p>` : `<div class="select"><select data-opt="${k}" data-riche aria-label="Format de ${esc(p.nom)}">
      ${f.opt == null ? `<option value="" selected disabled>Choisir</option>` : ""}
      ${ids.map(i => `<option value="${i}"${i === f.opt ? " selected" : ""} data-html="${esc(formatHtml(L[i], false, "Format " + (i + 1)))}">${sansPrix(i)}</option>`).join("")}
    </select></div>`;
  }
  const pl = prixLigne(p, f);
  const prix = pl.total == null ? `<span class="apd">Sur demande</span>`
    : f.opt == null ? `<span class="apd">dès</span> <b>${euros(pl.total)}</b>`
    : pl.remise ? `<s class="panier-barre">${euros(pl.base)}</s> <b>${euros(pl.total)}</b><span class="panier-lot" title="${esc(pl.detail)}">Tarif lot appliqué</span>`
    : `<b>${euros(pl.total)}</b>`;
  return `<li class="panier-ligne">
    <a class="panier-photo" href="#p-${p.id}">${visuel(p.photos[0], hash(p), "")}</a>
    <div class="panier-infos">
      <a class="panier-nom caps" href="#p-${p.id}">${esc(p.nom)}</a>
      <div class="panier-liens">${L.length > 1 || p.coul.length > 1 ? `<button type="button" class="panier-retirer" data-dupliquer="${k}" aria-label="Dupliquer ${esc(p.nom)} pour choisir une autre option">Dupliquer</button>` : ""}<button type="button" class="panier-retirer" data-retirer="${k}">Retirer</button></div>
    </div>
    <div class="panier-col panier-c-coul" data-label="Couleur">${couleur}</div>
    <div class="panier-col panier-c-format" data-label="Format">${format}</div>
    <div class="panier-qte" role="group" aria-label="Quantité de ${esc(p.nom)}">
      <button type="button" data-moins="${k}" aria-label="Diminuer la quantité"${f.qte <= 1 ? " disabled" : ""}>−</button>
      <span aria-live="polite">${f.qte}</span>
      <button type="button" data-plus="${k}" aria-label="Augmenter la quantité">+</button>
    </div>
    <p class="panier-prix">${prix}</p>
  </li>`;
}
/* Prix d'une ligne du panier. Si le format est un « Lot de N » et que la quantité
   permet de passer à un lot plus grand (ex. 4 × Lot de 1 = 1 Lot de 4), on applique
   automatiquement la combinaison de lots la moins chère. */
const tailleLot = l => { const m = String(l.nom || "").match(/lot\s+de\s+(\d+)/i); return m ? +m[1] : null; };
const cleDetail = l => String(l.detail || "").replace(/\*/g, "").trim().toLowerCase();
function prixLigne(p, f){
  const L = p.f.lignes, l = f.opt != null ? L[f.opt] : null;
  const c = f.coul != null && p.coul[f.coul] ? p.coul[f.coul] : {sup: supMin(p)};
  const pu = l ? prixAvec(l.prix, c) : prixMin(p);
  if (pu == null) return {total: null};
  const base = pu * f.qte, n = l && tailleLot(l);
  if (!n) return {total: base, base};
  const lots = L.filter(x => x.prix != null && tailleLot(x) && cleDetail(x) === cleDetail(l) && x.fin === l.fin)
    .map(x => ({n: tailleLot(x), prix: prixAvec(x.prix, c), nom: String(x.nom).trim()}));
  const unites = n * f.qte;
  if (unites > 400) return {total: base, base};
  const cout = Array(unites + 1).fill(Infinity), choix = Array(unites + 1).fill(null); cout[0] = 0;
  for (let u = 1; u <= unites; u++) for (const x of lots) if (x.n <= u && cout[u - x.n] + x.prix < cout[u]) { cout[u] = cout[u - x.n] + x.prix; choix[u] = x; }
  if (!isFinite(cout[unites]) || cout[unites] >= base - 0.001) return {total: base, base};
  const compte = new Map(); for (let u = unites; u > 0; u -= choix[u].n) compte.set(choix[u], (compte.get(choix[u]) || 0) + 1);
  const detail = [...compte].sort((a, b) => b[0].n - a[0].n).map(([x, c]) => `${c} × ${x.nom}`).join(" + ");
  return {total: cout[unites], base, remise: true, detail};
}
function totalFavoris(){
  let total = 0, aPreciser = false, surDemande = false;
  FAVORIS.forEach(f => {
    const p = PIECES.find(q => q.id === f.id);
    const pl = prixLigne(p, f);
    if (pl.total == null) { surDemande = true; return; }
    if (f.opt == null && p.f.lignes.length > 1) aPreciser = true;
    total += pl.total;
  });
  return {total, aPreciser, surDemande};
}
function messageWishlist(){
  /* Une pièce par puce : quantité, nom et prix, puis couleur et format sur la ligne suivante */
  const lignes = FAVORIS.map(f => {
    const p = PIECES.find(q => q.id === f.id);
    const detail = [p.coul.length ? (nomCouleur(p, f) || "couleur à préciser") : "",
      f.opt != null ? libelleFormat(p, f.opt) : (p.f.lignes.length > 1 ? "format à préciser" : "")].filter(x => x && x !== p.nom).join(" · ");
    const pl = (f.opt != null || p.f.lignes.length === 1) ? prixLigne(p, {...f, opt: f.opt ?? 0}) : {total: null};
    return `• ${f.qte} × ${p.nom}${pl.total != null ? ` — ${euros(pl.total)}` : ""}${detail ? `\n    ${detail}` : ""}${pl.remise ? `\n    tarif lot appliqué : ${pl.detail}` : ""}`;
  });
  const t = totalFavoris();
  return `Bonjour !\n\nVoici le détail de ma commande :\n\n${lignes.join("\n\n")}\n\nTotal estimé : ${euros(t.total)}${t.surDemande ? " (hors pièces sur demande)" : ""}\n\nMerci !`;
}

function favorisPage(){
  menu("favoris");
  const k = FAVORIS.length;
  if (!k) {
    $("#page").innerHTML = `

    </section>`;

  }
  const t = totalFavoris();

  $("#page").innerHTML = `

    <h1 class="caps">Favoris</h1>
    <p>${k} pièce${k > 1 ? "s" : ""} dans votre wishlist. Ajustez la couleur, le format et la quantité de chaque pièce, puis envoyez votre sélection sur Instagram pour passer commande.</p>
  </section>
  <section class="wrap panier">
    <div class="panier-entete caps" aria-hidden="true"><span>Pièce</span><span>Couleur</span><span>Format</span><span>Quantité</span><span>Prix</span></div>
    <ul class="panier-liste">${FAVORIS.map(ligneFav).join("")}</ul>
    <div class="panier-livraison">
      <p class="caps">Livraison</p>
      <p class="panier-liv-texte">À calculer selon le nombre de pièces et la destination</p>
    </div>
    <div class="panier-total">
      <p class="caps">Total${t.aPreciser ? " estimé" : ""}</p>
      <p class="panier-somme">${t.aPreciser ? `<span class="apd">dès</span> ` : ""}<b>${euros(t.total)}</b></p>
    </div>
    ${t.aPreciser || t.surDemande || coulManquante ? `<p class="panier-note">${[coulManquante ? "Choisissez la couleur de chaque pièce." : "", t.aPreciser ? "Choisissez un format pour chaque pièce afin d'obtenir le total exact." : "", t.surDemande ? "Les pièces « prix sur demande » ne sont pas comptées dans le total." : ""].filter(Boolean).join(" ")}</p>` : ""}
    <div class="panier-actions">
      <a class="cta caps" id="envoyer-wishlist" href="${igUrl}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#ig"/></svg>Envoyer ma commande</a>
      <p class="cta-note detail" id="wishlist-note">Votre commande est copiée en cliquant. Il suffit de la coller dans la conversation Instagram avec @${esc(SITE.instagram)} qui s'ouvre, puis d'envoyer.</p>
    </div>
  </section>`;
  const lien = $("#envoyer-wishlist");
  lien.href = igUrl + "?text=" + encodeURIComponent(messageWishlist());
  lien.addEventListener("click", () => {
    /* copie de secours : si Instagram n'affiche pas le message pré-écrit, il suffit de le coller */
    try { navigator.clipboard && navigator.clipboard.writeText(messageWishlist()); } catch (e) {}
    $("#wishlist-note").textContent = "Commande copiée. Collez-la dans la conversation Instagram, puis envoyez.";
  });
  menusRiches($("#page"));
}
/* Interactions du panier */
document.addEventListener("click", e => {
  if (location.hash !== "#favoris") return;
  const pc = e.target.closest(".panier .pastille");
  if (pc) {
    const at = [...pc.attributes].find(a => a.name.startsWith("data-coulfav-"));
    FAVORIS[+at.name.slice(13)].coul = +at.value; sauverFav(); return favorisPage();
  }
  const t = e.target.closest("[data-moins],[data-plus],[data-retirer],[data-dupliquer]"); if (!t) return;
  e.preventDefault();
  if (t.dataset.retirer != null) FAVORIS.splice(+t.dataset.retirer, 1);
  else if (t.dataset.dupliquer != null) { const i = +t.dataset.dupliquer; FAVORIS.splice(i + 1, 0, {...FAVORIS[i], qte: 1}); }
  else { const f = FAVORIS[+(t.dataset.moins ?? t.dataset.plus)]; f.qte = Math.max(1, f.qte + (t.dataset.plus != null ? 1 : -1)); }

});
document.addEventListener("change", e => {
  if (location.hash !== "#favoris") return;
  const s = e.target;
  if (s.dataset.opt != null) { FAVORIS[+s.dataset.opt].opt = +s.value; }
  else if (s.dataset.fin != null) {
    const f = FAVORIS[+s.dataset.fin], p = PIECES.find(q => q.id === f.id);
    f.opt = p.f.lignes.findIndex(l => l.fin === s.value);
  } else return;
  sauverFav(); favorisPage();
});

/* ---------- Recherche ---------- */
const sansAccents = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/œ/g, "oe").toLowerCase().replace(/[“”«»"'’*]/g, " ");
function texteRecherche(p){
  const sous = CATEGORIES.flatMap(c => c.sous || []).filter(s => s.id === p.sous).map(s => s.nom);
  return sansAccents([p.nom, p.desc, p.compo, ...p.cats.map(catNom), ...sous,
    ...COLLECTIONS.filter(c => c.pieces.includes(p.id)).map(c => c.nom),
    ...p.coul.map(c => c.nom), ...p.f.lignes.map(l => [l.fin, l.nom, l.detail].join(" "))].join(" "));
}
function chercher(q){
  const mots = sansAccents(q).split(/\s+/).filter(m => m.length > 1 || /\d/.test(m));
  if (!mots.length) return [];
  return PIECES.map(p => {
    const t = texteRecherche(p), nom = sansAccents(p.nom);
    if (!mots.every(m => t.includes(m))) return null;
    return {p, score: mots.filter(m => nom.includes(m)).length * 10 + (nom.startsWith(mots[0]) ? 5 : 0)};
  }).filter(Boolean).sort((a, b) => b.score - a.score).map(x => x.p);
}
const qDuHash = () => { const m = location.hash.match(/^#recherche(?:\?q=(.*))?$/); return m && m[1] ? decodeURIComponent(m[1]) : ""; };
function recherchePage(){
  menu("recherche");
  ouvrirRecherche(false);
  const q = qDuHash(), champ = $("#rech-q");
  if (champ && champ.value !== q && document.activeElement !== champ) champ.value = q;
  const res = chercher(q);
  const resume = !q.trim() ? "Tapez un nom de pièce, une couleur, une collection ou une matière."
    : res.length ? `${res.length} pièce${res.length > 1 ? "s" : ""} pour « ${esc(q.trim())} »`
    : `Aucune pièce ne correspond à « ${esc(q.trim())} ».`;
  $("#page").innerHTML = `
  <section class="wrap page-tete">
    <div class="fil"><a href="#accueil">Accueil</a> / Recherche</div>
    <h1 class="caps">Recherche</h1>
    <div class="fav-intro"><p class="detail">${resume}</p>${q.trim() && !res.length ? `<a class="lien-jost" href="#tout">Voir tous les produits</a>` : ""}</div>
  </section>
  ${res.length ? `<section class="wrap"><div class="grille">${res.map(carte).join("")}</div></section>` : ""}`;
}
function ouvrirRecherche(focus){
  const r = $("#rech"), b = $("#rech-btn"); if (!r) return;
  r.hidden = false; b.setAttribute("aria-expanded", "true");
  if (focus) $("#rech-q").focus();
}
function fermerRecherche(){
  const r = $("#rech"); if (!r) return;
  r.hidden = true; $("#rech-btn").setAttribute("aria-expanded", "false"); $("#rech-q").value = "";
  if (location.hash.startsWith("#recherche")) location.hash = "#tout";
}
(() => {
  const btn = $("#rech-btn"), champ = $("#rech-q");
  btn.addEventListener("click", () => $("#rech").hidden ? ouvrirRecherche(true) : fermerRecherche());
  $("#rech-fermer").addEventListener("click", fermerRecherche);
  champ.addEventListener("input", () => {
    const cible = "#recherche" + (champ.value ? "?q=" + encodeURIComponent(champ.value) : "");
    if (location.hash.startsWith("#recherche")) { history.replaceState(null, "", cible); recherchePage(); }
    else location.hash = cible;
  });
  champ.addEventListener("keydown", e => { if (e.key === "Escape") fermerRecherche(); });
})();

/* Burger : ouvre / ferme le menu sur mobile */
function fermerMenu(){ const hd = document.querySelector("header"); hd.classList.remove("menu-ouvert"); $("#burger").setAttribute("aria-expanded", "false"); }
$("#burger").addEventListener("click", e => {
  e.stopPropagation();
  const hd = document.querySelector("header"), ouvert = hd.classList.toggle("menu-ouvert");
  $("#burger").setAttribute("aria-expanded", ouvert);
});
document.addEventListener("click", e => { if (!e.target.closest("header")) fermerMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fermerMenu(); });

function route(){
  const h = location.hash.slice(1);
  document.body.classList.remove("accueil", "defile");
  fermerMenu();
  if (!h.startsWith("recherche") && !$("#rech").hidden) { $("#rech").hidden = true; $("#rech-btn").setAttribute("aria-expanded", "false"); $("#rech-q").value = ""; }
  if (h.startsWith("p-")) fiche(h.slice(2));
  else if (h.startsWith("c-")) collection(h.slice(2));
  else if (h === "collections") collectionsPage();
  else if (h === "favoris") favorisPage();
  else if (h.startsWith("recherche")) recherchePage();
  else if (CATEGORIES.some(c => c.sous && h.startsWith(c.id + "-"))) { const c = CATEGORIES.find(c => c.sous && h.startsWith(c.id + "-")); categorie(c.id, h.slice(c.id.length + 1)); }
  else if (h === "tout" || CATEGORIES.some(c => c.id === h)) categorie(h);
  else accueil();
  window.scrollTo(0, 0);
}

majCompteurFav();

$("#pied-dm").href = igUrl;
/* Bandeau d'annonce tout en haut du site */
(() => { const a = $("#annonce"); const t = (SITE.annonce || "").trim(); a.textContent = t; a.hidden = !t; })();
const lienIg = $("#pied-ig"); lienIg.href = igUrl; lienIg.textContent = "@" + SITE.instagram;
/* Menu et logo posés sur la photo d'accueil : blanc ou noir selon l'image */
function couleurs(menuBlanc, logoBlanc){
  logoBlanc = true;  /* signature toujours en blanc sur la photo */
  const r = document.documentElement.style;
  r.setProperty("--menu-photo", menuBlanc ? "#FFFFFF" : "var(--encre)");
  r.setProperty("--logo-photo", logoBlanc ? "#FFFFFF" : "var(--encre)");
  document.body.classList.toggle("menu-blanc", menuBlanc);
  document.body.classList.toggle("logo-blanc", logoBlanc);
}
/* Luminosité moyenne (0 = noir, 1 = blanc) d'une zone de l'image */
function luminosite(img, y0, y1, x0 = 0, x1 = 1){
  const c = document.createElement("canvas"); c.width = 40; c.height = 40;
  const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, 40, 40);
  const d = ctx.getImageData(Math.round(x0*40), Math.round(y0*40), Math.max(1, Math.round((x1-x0)*40)), Math.max(1, Math.round((y1-y0)*40))).data;
  let s = 0; for (let i = 0; i < d.length; i += 4) s += (0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2]) / 255;
  return s / (d.length / 4);
}
function ajusterCouleurs(){
  if (SITE.couleurSurPhoto === "blanc") return couleurs(true, true);
  if (SITE.couleurSurPhoto === "noir") return couleurs(false, false);
  const img = document.getElementById("bandeau-img");
  if (!img) return couleurs(true, true);
  const calc = () => {
    try { couleurs(luminosite(img, 0, .2) < .6, luminosite(img, .3, .7, .3, .7) < .6); }
    catch (e) { couleurs(true, true); }
  };
  img.complete ? calc() : img.addEventListener("load", calc, {once:true});
}
const entete = document.querySelector("header");
const mesure = () => document.documentElement.style.setProperty("--h-header", entete.offsetHeight + "px");
const defile = () => {
  const b = document.querySelector(".bandeau");
  document.body.classList.toggle("defile", !!b && window.scrollY > b.offsetHeight - entete.offsetHeight - 4);
};
window.addEventListener("resize", () => { mesure(); defile(); });
window.addEventListener("scroll", defile, {passive:true});

window.addEventListener("hashchange", route);
route();
mesure(); defile();
