name: Mise à jour du site depuis Notion

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:        # bouton « Run workflow » pour forcer une mise à jour
  push:
    branches: [main]
    paths: ["outil/**", "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # toujours la dernière version (évite les conflits entre deux mises à jour rapprochées)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire le site depuis Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python outil/build.py
      - name: Enregistrer si le site a changé
        id: maj
        run: |
          if ! git diff --quiet -- site/; then
            echo "change=oui" >> "$GITHUB_OUTPUT"
            git config user.name "Mise à jour automatique"
            git config user.email "actions@users.noreply.github.com"
            git add site/
            git commit -m "Mise à jour depuis Notion"
            git push
          fi
      # Publication sur GitHub Pages (gratuit, mises à jour illimitées)
      - name: Préparer la publication
        if: steps.maj.outputs.change == 'oui' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier sur GitHub Pages
        id: deploiement
        if: steps.maj.outputs.change == 'oui' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
